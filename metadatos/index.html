<!DOCTYPE html>
<html lang="es">

<head>

    <!-- ================================================= -->
    <!-- CONFIGURACIÓN BÁSICA -->
    <!-- ================================================= -->

    <!-- Codificación de caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptación a celulares y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- ================================================= -->
    <!-- INFORMACIÓN DEL DOCUMENTO -->
    <!-- ================================================= -->

    <!-- Descripción de la página -->
    <meta name="description"
          content="Página de presentación personal de un ingeniero mecatrónico.">

    <!-- Palabras clave -->
    <meta name="keywords"
          content="mecatrónica, robótica, programación, automatización, ingeniería">

    <!-- Autor -->
    <meta name="author"
          content="Daniel Antonio">

    <!-- Indica al navegador que el contenido pertenece a una aplicación/página -->
    <meta name="application-name"
          content="Portafolio Personal">


    <!-- ================================================= -->
    <!-- COMPATIBILIDAD -->
    <!-- ================================================= -->

    <!-- Compatibilidad con Internet Explorer -->
    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">


    <!-- ================================================= -->
    <!-- REFERRER POLICY -->
    <!-- ================================================= -->

    <!-- Controla qué información de referencia se envía -->
    <meta name="referrer"
          content="strict-origin-when-cross-origin">


    <!-- ================================================= -->
    <!-- COLOR DEL NAVEGADOR -->
    <!-- ================================================= -->

    <!-- Color de la interfaz del navegador en dispositivos compatibles -->
    <meta name="theme-color"
          content="#1D3947">


    <!-- ================================================= -->
    <!-- CONFIGURACIÓN PARA iOS -->
    <!-- ================================================= -->

    <!-- Hace que la página pueda comportarse como una aplicación -->
    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <!-- Estilo de la barra de estado en iOS -->
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <!-- Nombre cuando se guarda como aplicación -->
    <meta name="apple-mobile-web-app-title"
          content="Mi Portafolio">


    <!-- ================================================= -->
    <!-- REDES SOCIALES - OPEN GRAPH -->
    <!-- ================================================= -->

    <!-- Título que aparecerá al compartir -->
    <meta property="og:title"
          content="Mi Portafolio - Ingeniería Mecatrónica">

    <!-- Descripción -->
    <meta property="og:description"
          content="Portafolio de proyectos de robótica, automatización y programación.">

    <!-- Tipo de contenido -->
    <meta property="og:type"
          content="website">

    <!-- URL de la página -->
    <meta property="og:url"
          content="https://ejemplo.com">

    <!-- Imagen que aparecerá al compartir -->
    <meta property="og:image"
          content="https://ejemplo.com/img/portada.jpg">

    <!-- Idioma -->
    <meta property="og:locale"
          content="es_MX">

    <!-- ================================================= -->
    <!-- SEGURIDAD -->
    <!-- ================================================= -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'">


    <!-- ================================================= -->
    <!-- TÍTULO -->
    <!-- ================================================= -->

    <title>Meta datos</title>
      <link rel="icon" href="ico.png">
</head>

</html>
