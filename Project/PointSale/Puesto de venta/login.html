<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="style/login.css">

</head>


<body>


    <!-- =====================================================
         LOGIN
    ===================================================== -->

    <main class="login-container">


        <section class="login-card">


            <!-- ANILLOS -->

            <div class="anillos">

                <span class="anillo"></span>

                <span class="anillo"></span>

                <span class="anillo"></span>

                <span class="anillo"></span>

            </div>


            <!-- LOGO -->

            <div class="logo">

                👤

            </div>


            <!-- TÍTULO -->

            <h1 class="titulo">

                Bienvenido

            </h1>


            <p class="subtitulo">

                Sistema de restaurante

            </p>


            <!-- FORMULARIO -->

            <div class="formulario">


                <!-- CORREO -->

                <label for="user_id">

                    User id

                </label>


                <input
                    type="number"
                    id="user_id"
                    name="user id"
                    placeholder=""
                    required
                >


                <!-- CONTRASEÑA -->

                <label for="password">

                    password

                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                >


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="boton-login"
                    onclick="login()">
                    Iniciar sesión
                </button>


            </div>
            <!-- PIE -->

            <div class="pie">

                Acceso exclusivo para personal autorizado

            </div>

            <script src="script/login.js"></script>
        </section>


    </main>


</body>

</html>
