<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuevo pedido</title>

    <link rel="stylesheet"
          href="style/TakeOnNewOrder.css">

</head>

<body>

    <main class="nuevo-pedido">

        <!-- =========================================
             PRODUCTOS
        ========================================== -->

        <section class="lista-productos">

            <h2>Productos</h2>

            <div id="productos">

                <!--
                    TakeOnNewOrder.js
                    colocará aquí los productos
                -->

            </div>

        </section>


        <!-- =========================================
             PEDIDO
        ========================================== -->

        <aside class="pedido">

            <h2>Pedido</h2>

            <div id="pedido">

                <div class="pedido-vacio">
                    No hay productos en el pedido.
                </div>

            </div>


            <div class="pedido-total">

                <span>Total</span>

                <strong id="total">
                    $0.00
                </strong>

            </div>


            <button id="confirmarPedido">
                Confirmar pedido
            </button>

        </aside>

    </main>


    <script src="script/TakeOnNewOrder.js"></script>

</body>

</html>
