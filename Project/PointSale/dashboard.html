<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cuentas Activas</title>
    <link rel="stylesheet" href="style/dashboard.css">
</head>


<body>
    
<div class="contenedor">


    <!-- =====================================================
         SIDEBAR
    ===================================================== -->

    <aside class="sidebar">


        <!-- PERFIL FIJO -->

        <div class="perfil">

            <div class="foto-mesero">
                👤
            </div>

            <div class="nombre-mesero">
                Daniel
            </div>

            <div class="cargo-mesero">
                Mesero
            </div>

        </div>


        <!-- NUEVA CUENTA -->

        <button class="nueva-cuenta">

            + &nbsp; Nueva cuenta

        </button>


        <div class="separador"></div>


        <!-- =================================================
             ADMINISTRACIÓN CON SCROLL
        ================================================= -->

        <div class="administracion">


            <div class="titulo-admin">

                Administración

            </div>


            <nav class="menu">


                <button class="menu-boton activo">

                    ▣ &nbsp; Cuentas activas

                </button>


                <button class="menu-boton">

                    ▤ &nbsp; Historial

                </button>


                <button class="menu-boton">

                    ◉ &nbsp; Productos

                </button>


                <button class="menu-boton">

                    ▦ &nbsp; Mesas

                </button>


                <button class="menu-boton">

                    👥 &nbsp; Usuarios

                </button>


                <button class="menu-boton">

                    📊 &nbsp; Reportes

                </button>


                <button class="menu-boton">

                    ⚙ &nbsp; Configuración

                </button>


                <!-- Más opciones para demostrar
                     el funcionamiento del scroll -->

                <div class="subtitulo">

                    Gestión

                </div>


                <button class="menu-boton">

                    Categorías

                </button>


                <button class="menu-boton">

                    Inventario

                </button>


                <button class="menu-boton">

                    Descuentos

                </button>


                <button class="menu-boton">

                    Métodos de pago

                </button>


                <button class="menu-boton">

                    Impuestos

                </button>


                <button class="menu-boton">

                    Caja

                </button>


                <button class="menu-boton">

                    Cortes

                </button>


                <button class="menu-boton">

                    Estadísticas

                </button>


            </nav>


            <!-- PAGAR -->

            <button class="boton-pagar">

                $ &nbsp; Pagar cuenta

            </button>


        </div>


        <!-- =================================================
             CAMBIAR MESERO - FIJO
        ================================================= -->

        <div class="parte-inferior">

            <div class="separador"></div>

            <button class="cambiar-mesero">

                ↔ &nbsp; Cambiar mesero

            </button>

        </div>


    </aside>



    <!-- =====================================================
         CONTENIDO
    ===================================================== -->

    <main class="contenido" id="contenido">
    </main>
<script src="script/dashboard.js"></script>
</div>

</body>

</html>
